# Used by bin/plugin-check.sh on top of docker-compose.yml: mounts the folder
# bin/build-zip.sh builds in place of the source, so Plugin Check sees exactly
# what would ship.
services:
  wp:
    volumes:
      - ../../../dist/axle-read-only-mode:/var/www/html/wp-content/plugins/axle-read-only-mode:ro
  cli:
    volumes:
      - ../../../dist/axle-read-only-mode:/var/www/html/wp-content/plugins/axle-read-only-mode:ro
