# A multisite WordPress for the network end-to-end tests:
#   docker compose -f tests/e2e-multisite/docker-compose.yml up -d
#   npx playwright test -c tests/e2e-multisite/playwright.config.js
# It listens on http://localhost:8921 with its own database and files, so it never touches the
# single-site test site on 8911. The plugin is mounted read-only, like in tests/e2e/env.
name: axle-read-only-mode-e2e-ms

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wp
  WORDPRESS_DB_PASSWORD: wp
  WORDPRESS_DB_NAME: wp
  WORDPRESS_DEBUG: 1
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', false );

x-mounts: &mounts
  - wp_data:/var/www/html
  - ../..:/var/www/html/wp-content/plugins/axle-read-only-mode:ro

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp

  wp:
    image: wordpress:${WP_IMAGE_TAG:-php8.3-apache}
    depends_on: [db]
    ports:
      - "127.0.0.1:${WP_PORT:-8921}:80"
    environment: *wp-env
    volumes: *mounts

  cli:
    image: wordpress:cli-php8.3
    depends_on: [db, wp]
    user: "33:33"
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes: *mounts
    command: ["sleep", "infinity"]

volumes:
  wp_data:
